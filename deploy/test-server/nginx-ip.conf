# Single-agent IP TEST gateway. Production tenant domains still use the normal
# Host-preserving gateway. Only HQ needs a fixed virtual Host on its own port.
# Validate browser Origin BEFORE translating it; never blank arbitrary origins.
map $http_origin $nightflix_hq_origin {
  default invalid;
  "" "";
  "https://47.110.245.29:9441" "https://admin.nightflix.test";
}

server {
  listen 9441 ssl;
  server_name 47.110.245.29;
  ssl_certificate /etc/letsencrypt/live/nightflix-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nightflix-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /opt/nightflix/current/static/platform;
  if ($http_host != "47.110.245.29:9441") { return 421; }
  if ($nightflix_hq_origin = invalid) { return 403; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Host admin.nightflix.test;
    proxy_set_header Origin $nightflix_hq_origin;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}

server {
  listen 9442 ssl;
  server_name 47.110.245.29;
  ssl_certificate /etc/letsencrypt/live/nightflix-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nightflix-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /opt/nightflix/current/static/tenant;
  if ($http_host != "47.110.245.29:9442") { return 421; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
    proxy_pass http://127.0.0.1:3202;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}

server {
  listen 443 ssl;
  server_name 47.110.245.29;
  ssl_certificate /etc/letsencrypt/live/nightflix-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nightflix-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /opt/nightflix/current/static/web;
  if ($http_host !~ "^47\.110\.245\.29(:443)?$") { return 421; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
