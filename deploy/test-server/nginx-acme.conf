# Temporary bootstrap listener: no application or account data over HTTP.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  location = /.well-known/acme-challenge/nightflix-connectivity {
    default_type text/plain;
    return 200 "nightflix-challenge-ready\n";
  }
  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    try_files $uri =404;
  }
  location / { return 404; }
}
